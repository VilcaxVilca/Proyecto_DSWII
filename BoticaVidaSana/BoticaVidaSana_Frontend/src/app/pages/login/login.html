<section class="login-layout">
  <div class="login-brand">
    <img src="/img/botica-logo.png" alt="Botica Sana">
  </div>

  <div class="card login-card">
    <div class="card-body">
      <div class="login-mark">+</div>
      <h2>¡Bienvenido!</h2>
      <p class="login-subtitle">Inicia sesion para continuar</p>

      <form (ngSubmit)="ingresar()">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" name="username" autocomplete="username" placeholder="Usuario o correo electronico" [(ngModel)]="username" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Contrasena</label>
          <input class="form-control" type="password" name="password" autocomplete="current-password" placeholder="Contrasena" [(ngModel)]="password" required>
        </div>

        <div class="login-options">
          <span></span>
          <a href="#" onclick="return false;">¿Olvidaste tu contrasena?</a>
        </div>

        <button class="btn btn-primary w-100" type="submit">Iniciar sesion</button>
      </form>

      <div class="alert alert-danger mt-3" *ngIf="error">{{error}}</div>
    </div>
  </div>
</section>
